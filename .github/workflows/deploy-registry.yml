name: deploy-registry

# Build the static audit registry from registry/audits/ and publish it to
# GitHub Pages. No third-party services; the site is pure static HTML/JSON.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the static registry
        run: |
          mkdir -p registry/audits
          python -m paperunit registry build --audits-dir registry/audits --out registry/site
          test -f registry/site/index.html
          test -f registry/site/index.json

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: registry/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
