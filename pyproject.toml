[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperunit"
version = "0.3.1"
description = "Executable paper audits: bind paper claims to checks a third party can re-run"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "无常 (pseudonym)" }]
keywords = ["reproducibility", "audit", "metascience", "formal-verification"]
dependencies = []

[project.optional-dependencies]
z3 = ["z3-solver>=4.13"]
dev = ["pytest>=8"]

[project.scripts]
paperunit = "paperunit.cli:main"

[tool.setuptools.packages.find]
include = ["paperunit*"]

[tool.setuptools.package-data]
paperunit = ["site_assets/*"]
